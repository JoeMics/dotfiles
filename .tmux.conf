# TokyoNight Night — tmux theme
# Background: #1a1b26, foreground: #c0caf5

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar
set -g status-position bottom
set -g status-justify left

set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left status — session name
set -g status-left "#[fg=#7aa2f7,bold] #S #[fg=#3b4261]│ "
set -g status-left-length 40

# Right status — time/date
set -g status-right "#[fg=#565f89] %H:%M #[fg=#3b4261]│ #[fg=#7aa2f7]%d %b "
set -g status-right-length 60

# Window tabs — inactive
set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "

# Window tabs — active
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Pane content — dim inactive, full color active
set -g window-style "fg=#565f89,bg=#1a1b26"
set -g window-active-style "fg=#c0caf5,bg=#1a1b26"

# Message / command prompt
set -g message-style "fg=#7aa2f7,bg=#1a1b26,bold"
set -g message-command-style "fg=#c0caf5,bg=#1a1b26"

# Mode (copy mode, etc.)
set -g mode-style "fg=#1a1b26,bg=#7aa2f7"

# dim inactive panes
# set -g window-style 'fg=colour245,bg=colour234'
# set -g window-active-style 'fg=colour255,bg=default'


# Keybinds and behaviour

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g mouse on

# pane and window creation
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
